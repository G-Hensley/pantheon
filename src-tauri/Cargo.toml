[package]
name = "pantheon"
version = "0.1.0"
description = "Multi-agent cockpit: parallel AI coding sessions with a shared brain"
authors = ["Gavin Hensley"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pantheon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live PTY sessions (ConPTY on Windows via wezterm's crate).
portable-pty = "0.9"
# Only the sync mpsc — Tauri's runtime drives the futures, so we skip tokio's runtime.
# "time" is declared because `wait_for_tasks` and `ask_conductor` sleep between
# polls. It already resolved through feature unification from a transitive
# dependency, so the build was green without it, but relying on that means the
# day axum or tauri stops requesting it this crate stops compiling for a reason
# that has nothing to do with the change that triggered it.
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
rmcp = { version = "3.1.1", features = ["schemars", "server", "transport-streamable-http-server"] }
axum = "0.8.9"
uuid = { version = "1.24.0", features = ["v4"] }
schemars = "1"
tauri-plugin-dialog = "2.7.2"

[target.'cfg(unix)'.dependencies]
# Process groups let Pantheon terminate a headless agent and every tool it forked.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects are the Windows process-tree boundary and kill children if the
# owning Pantheon process closes its last job handle.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
