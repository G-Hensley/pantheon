# pnpm 11 no longer reads the "pnpm" field in package.json; these settings live
# here instead. Keep this file even though there is no workspace: it is where
# pnpm now expects overrides and build-script approvals.

# esbuild's postinstall links the platform binary Vite runs. pnpm 11 blocks
# unapproved build scripts and fails the whole install, so without this every
# `pnpm build` and `pnpm test` dies before it starts.
allowBuilds:
  esbuild: true

# Supply-chain pin carried over from package.json (nanoid < 3.3.17).
overrides:
  nanoid@<3.3.17: 3.3.17
