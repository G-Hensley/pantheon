name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every job carries an explicit timeout. GitHub's default is 360 minutes,
  # which is not a safety net so much as a way to burn most of a day of runner
  # time before anyone notices a job is wedged. These bounds are generous
  # against observed times (frontend ~15s, rust ~12m) and exist to fail fast,
  # not to squeeze.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      # Compiling cargo-audit from source is slow on both legs and the result
      # is not OS-dependent (it scans the dependency graph, not the target),
      # so it runs once, on the Linux leg.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked
      - if: matrix.os == 'ubuntu-latest'
        run: cargo audit
